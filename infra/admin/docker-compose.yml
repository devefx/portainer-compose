services:
  termix:
    image: ghcr.io/termix-ssh/termix:latest
    container_name: termix
    restart: unless-stopped
    labels:
      - com.centurylinklabs.watchtower.enable=true
    ports:
      - "6225:6225"
    volumes:
      - /srv/docker/appdata/termix:/app/data
    environment:
      PORT: "6225"
      # RDP/VNC/Telnet run in Termix's built-in engine; no guacd container needed.
      REMOTE_DESKTOP_ENGINE: "builtin"
    networks:
      - portainer_default
  dbx:
    container_name: dbx
    image: t8y2/dbx:latest
    restart: unless-stopped
    labels:
      - com.centurylinklabs.watchtower.enable=true
    ports:
      - "4224:4224"
    volumes:
      - /srv/docker/appdata/dbx:/app/data
    networks:
      - portainer_default
  redisinsight:
    container_name: redisinsight
    image: redis/redisinsight:latest
    restart: unless-stopped
    labels:
      - com.centurylinklabs.watchtower.enable=true
    ports:
      - 5540:5540
    networks:
      - portainer_default
networks:
  portainer_default:
    external: true
