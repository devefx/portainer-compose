services:
  open-webui:
    container_name: open-webui
    image: ghcr.io/open-webui/open-webui
    ports:
      - "3001:8080"
    volumes:
      - /srv/docker/appdata/open-webui:/app/backend/data
    networks:
      - portainer_default
    restart: unless-stopped
  n8n:
    container_name: n8n
    restart: always
    image: docker.n8n.io/n8nio/n8n
    user: "1000:1000"
    ports:
      - 5678:5678
    volumes:
      - /srv/docker/appdata/n8n_data:/home/node/.n8n
    networks:
      - portainer_default
    environment:
      - N8N_SECURE_COOKIE=false
      - N8N_HOST=${N8N_HOST}
  magpie:
    container_name: magpie
    restart: unless-stopped
    image: ghcr.io/yetone/magpie:latest
    labels:
      - com.centurylinklabs.watchtower.enable=true
    ports:
      - 3425:3425
      - 3430:3430
    volumes:
      - /srv/docker/appdata/magpie:/config
    networks:
      - portainer_default
    environment:
      - MAGPIE_WEB_KEY=${MAGPIE_WEB_KEY}
    command: web --addr 0.0.0.0:3430 --no-open
networks:
  portainer_default:
    external: true
