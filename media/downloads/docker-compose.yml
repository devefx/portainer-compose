services:
  fluxdown-server:
    image: ghcr.io/zerx-lab/fluxdown-server:latest
    container_name: fluxdown-server
    labels:
      - com.centurylinklabs.watchtower.enable=true
    environment:
      - FLUXDOWN_HOST=0.0.0.0
      - FLUXDOWN_PORT=17800
      - FLUXDOWN_DATA_DIR=/data
      - FLUXDOWN_MCP_ENABLED=true
    volumes:
      - /srv/docker/appdata/fluxdown:/data
      - /mnt/nas/downloads:/root/Downloads
    restart: unless-stopped
    ports:
      - "17800:17800"
      - "4662:4662" # eD2K TCP; set ed2k_listen_port=4662 in FluxDown, it defaults to 0 (random)
      - "4665:4665/udp" # reserved: FluxDown binds no fixed eD2K UDP port
      - "4672:4672/udp" # reserved: Kad uses an ephemeral outbound socket
    networks:
      - portainer_default
  xunlei:
    image: cnk3x/xunlei:latest
    container_name: xunlei
    volumes:
      - /srv/docker/appdata/xunlei:/xunlei/data
      - /mnt/nas/downloads:/xunlei/downloads
    environment:
      XL_DASHBOARD_USERNAME: ${XL_DASHBOARD_USERNAME:-admin}
      XL_DASHBOARD_PASSWORD: ${XL_DASHBOARD_PASSWORD:-admin}
    restart: always
    privileged: true
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
    ports:
      - "2345:2345"
    networks:
      - portainer_default
networks:
  portainer_default:
    external: true
