services:
  fluxdown-server:
    image: ghcr.io/zerx-lab/fluxdown-server:0.4.3
    container_name: fluxdown-server
    environment:
      - FLUXDOWN_HOST=0.0.0.0
      - FLUXDOWN_PORT=17800
      - FLUXDOWN_DATA_DIR=/data
      - FLUXDOWN_MCP_ENABLED=true
    volumes:
      - /srv/docker/appdata/fluxdown:/data
      - /mnt/nas/downloads:/root/Downloads
    restart: unless-stopped
    ports:
      - "17800:17800"
    networks:
      - portainer_default
  xunlei:
    image: cnk3x/xunlei:latest
    container_name: xunlei
    volumes:
      - /srv/docker/appdata/xunlei:/xunlei/data
      - /mnt/nas/downloads:/xunlei/downloads
    environment:
      XL_DASHBOARD_USERNAME: ${XL_DASHBOARD_USERNAME:-admin}
      XL_DASHBOARD_PASSWORD: ${XL_DASHBOARD_PASSWORD:-admin}
    restart: always
    privileged: true
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
    ports:
      - "2345:2345"
    networks:
      - portainer_default
  amule:
    image: ngosang/amule:latest
    container_name: amule
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Shanghai
      - WEBUI_PWD=${AMULE_WEBUI_PWD}
      - GUI_PWD=${AMULE_GUI_PWD:-}
      - FIX_PERMISSIONS=${AMULE_FIX_PERMISSIONS:-true}
      - MOD_AUTO_RESTART_ENABLED=true
      - MOD_AUTO_RESTART_CRON=0 6 * * *
      - MOD_AUTO_SHARE_ENABLED=${AMULE_AUTO_SHARE_ENABLED:-false}
    volumes:
      - /srv/docker/appdata/amule:/home/amule/.aMule
      - /mnt/nas/downloads:/downloads
    ports:
      - "4711:4711" # Web UI + REST API (amuleapi, plain HTTP)
      - "4662:4662" # ED2K client-to-client TCP, needs to be reachable for High ID
      - "4665:4665/udp" # ED2K server UDP, global searches
      - "4672:4672/udp" # Extended eMule protocol + Kademlia
    restart: unless-stopped
    networks:
      - portainer_default
networks:
  portainer_default:
    external: true
