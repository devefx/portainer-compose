services:
  immich:
    container_name: immich
    restart: unless-stopped
    image: ghcr.io/imagegenius/immich:latest
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Shanghai
      - DB_HOSTNAME=immich-postgres16
      - DB_PORT=5432
      - DB_DATABASE_NAME=${IMMICH_DB_DATABASE_NAME}
      - DB_USERNAME=${IMMICH_DB_USERNAME}
      - DB_PASSWORD=${IMMICH_DB_PASSWORD}
      - REDIS_HOSTNAME=immich-valkey
      - REDIS_PORT=6379
      - MACHINE_LEARNING_HOST=0.0.0.0
      - MACHINE_LEARNING_PORT=3003
      - MACHINE_LEARNING_WORKERS=1
      - MACHINE_LEARNING_WORKER_TIMEOUT=120
    volumes:
      - /srv/docker/appdata/immich/config:/config
      - /srv/docker/appdata/immich/libraries:/libraries
      - /mnt/nas/photos:/photos
    ports:
      - 2283:8080
    networks:
      - immich_network
    depends_on:
      - immich-postgres16
      - immich-valkey
    devices:
      - /dev/dri:/dev/dri
  immich-valkey:
    image: valkey/valkey:8-bookworm
    container_name: immich-valkey
    restart: unless-stopped
    ports:
      - 6379:6379
    networks:
      - immich_network
  immich-postgres16:
    image: ghcr.io/immich-app/postgres:16-vectorchord0.4.3-pgvectors0.2.0
    container_name: immich-postgres16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${IMMICH_DB_USERNAME}
      POSTGRES_PASSWORD: ${IMMICH_DB_PASSWORD}
      POSTGRES_DB: ${IMMICH_DB_DATABASE_NAME}
    volumes:
      - /srv/docker/appdata/immich/postgres16:/var/lib/postgresql/data
    ports:
      - 5432:5432
    networks:
      - immich_network
  photoprism:
    image: photoprism/photoprism:latest
    container_name: photoprism
    restart: unless-stopped
    ports:
      - 2342:2342
    environment:
      PHOTOPRISM_ADMIN_PASSWORD: ${PHOTOPRISM_ADMIN_PASSWORD}
      PHOTOPRISM_DATABASE_DRIVER: "mysql"
      PHOTOPRISM_DATABASE_SERVER: ${MARIADB_HOST}:${MARIADB_PORT}
      PHOTOPRISM_DATABASE_NAME: ${PHOTOPRISM_DB_DATABASE}
      PHOTOPRISM_DATABASE_USER: ${PHOTOPRISM_DB_USER}
      PHOTOPRISM_DATABASE_PASSWORD: ${PHOTOPRISM_DB_PASSWORD}
      PHOTOPRISM_ORIGINALS_LIMIT: 5000
      PHOTOPRISM_HTTP_COMPRESSION: "gzip"
      PHOTOPRISM_LOG_LEVEL: "info"
      PHOTOPRISM_READONLY: "false"
      PHOTOPRISM_DISABLE_TLS: "true"
      PHOTOPRISM_SITE_URL: ${PHOTOPRISM_SITE_URL}
    volumes:
      - /mnt/nas/photoprism/storage:/photoprism/storage
      - /mnt/nas/media/photos/100EOSR6:/photoprism/originals/100EOSR6
    networks:
      - portainer_default
networks:
  portainer_default:
    external: true
  immich_network:
    driver: bridge
